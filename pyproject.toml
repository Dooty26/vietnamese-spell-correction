[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vspell"
version = "0.1.0"
description = "Phát hiện và sửa lỗi chính tả tiếng Việt: n-gram LM và BARTpho"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
