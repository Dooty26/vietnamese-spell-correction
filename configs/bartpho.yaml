model_name: vinai/bartpho-syllable
seed: 42
max_source_length: 128
max_target_length: 128
train_size: 150000           # ablation mật độ nhiễu dùng 50000
num_train_epochs: 3
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
learning_rate: 5.0e-5
warmup_ratio: 0.05
weight_decay: 0.01
fp16: true
eval_steps: 2000
save_steps: 2000
save_total_limit: 2
metric_for_best_model: eval_loss   # chọn checkpoint theo Syn-val
num_beams: 4
output_dir: outputs/checkpoints/bartpho
